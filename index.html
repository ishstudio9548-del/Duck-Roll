    canvas.width=Math.floor(W*DPR);

}

function loadSave(){
    try{
        const raw=localStorage.getItem(SAVE_KEY);

        if(raw){
            save={...defaultSave,...JSON.parse(raw)};
        }else{
            save={...defaultSave,unlocked:[true,false,false,false,false]};
        }
    }catch(e){
        save={...defaultSave,unlocked:[true,false,false,false,false]};
    }

    if(!Array.isArray(save.unlocked)){
        save.unlocked=[true,false,false,false,false];
    }

    while(save.unlocked.length<5){
        save.unlocked.push(false);
    }
}

function saveGame(){

/* =========================================================
   AUDIO
   ========================================================= */

let audioCtx=null;
let musicTimer=null;
let musicStep=0;

function initAudio(){
    if(!audioCtx){
        try{
            audioCtx=new(window.AudioContext||window.webkitAudioContext)();
        }catch(e){
            return;
        }
    }

    if(audioCtx.state==="suspended"){
        audioCtx.resume().catch(()=>{});
    }
}

function tone(freq,duration,type="sine",volume=.04){
    if(!save.sound)return;

    initAudio();

    if(!audioCtx)return;

    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();

    osc.type=type;
    osc.frequency.value=freq;

    gain.gain.setValueAtTime(.0001,audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(
        volume,
        audioCtx.currentTime+.012
    );
    gain.gain.exponentialRampToValueAtTime(
        .0001,
        audioCtx.currentTime+duration
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime+duration+.02);
}

function jumpSound(){
    tone(480,.07,"square",.025);
    setTimeout(()=>tone(700,.07,"square",.02),35);
}

function coinSound(){

    musicTimer=setInterval(()=>{

        tone(
            notes[musicStep%notes.length],
            .13,
            "triangle",
            .008
        );

        musicStep++;
    },330);
}

function stopMusic(){
    if(musicTimer){
        clearInterval(musicTimer);
        musicTimer=null;
    }
}

/* =========================================================
   HELPERS
   ========================================================= */

function clamp(v,a,b){
    return Math.max(a,Math.min(b,v));
}

function rand(a,b){
    return a+Math.random()*(b-a);
}

function chance(p){
    return Math.random()<p;
}

function lerp(a,b,t){
    return a+(b-a)*t;
}

function roundRect(x,y,w,h,r){
    r=Math.min(r,w/2,h/2);

    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
}

function rectHit(x,y,w,h,px,py){
    return px>=x&&px<=x+w&&py>=y&&py<=y+h;
}

function mixColor(a,b,t){
    const A=hex(a);
    const B=hex(b);

    return `rgb(
        ${Math.round(lerp(A.r,B.r,t))},
        ${Math.round(lerp(A.g,B.g,t))},
        ${Math.round(lerp(A.b,B.b,t))}
    )`;
}

function hex(c){
    return{
        r:parseInt(c.slice(1,3),16),
        g:parseInt(c.slice(3,5),16),
        b:parseInt(c.slice(5,7),16)
    };
}

/* =========================================================
   BACKGROUND
   ========================================================= */

function createBackground(){
    clouds=[];
    stars=[];

    for(let i=0;i<10;i++){
        clouds.push({
            x:rand(-100,W+100),
            y:rand(40,H*.42),
            s:rand(.55,1.15),
            speed:rand(4,11)
        });
    }

    for(let i=0;i<70;i++){
        stars.push({
            x:Math.random()*W,
            y:Math.random()*H*.7,
            r:rand(.5,1.6),
            a:rand(.3,1)
        });
    }
}

createBackground();

function drawSky(){
    const cycle=(elapsed/18)%3;

    let top,bottom;

    if(cycle<1){
        top=mixColor("#55cfff","#ff9968",cycle);
        bottom=mixColor("#d7f7ff","#ffd39a",cycle);
    }
    else if(cycle<2){
        const t=cycle-1;
        top=mixColor("#ff9968","#101b48",t);
        bottom=mixColor("#ffd39a","#263861",t);
    }
    else{
        const t=cycle-2;
        top=mixColor("#101b48","#55cfff",t);
        bottom=mixColor("#263861","#d7f7ff",t);
    }

    const g=ctx.createLinearGradient(0,0,0,H);

    g.addColorStop(0,top);
    g.addColorStop(1,bottom);

    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);

    let night=0;

    if(cycle>1){
        night=cycle<2
            ?cycle-1
            :1-(cycle-2);
    }

    if(night>.02){
        ctx.save();

        for(const s of stars){
            ctx.globalAlpha=night*s.a;
            ctx.fillStyle="#fff";

            ctx.beginPath();
            ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
            ctx.fill();
        }

        ctx.globalAlpha=night;

        ctx.fillStyle="#fff4c7";
        ctx.beginPath();
        ctx.arc(W*.82,H*.16,28,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle="#17244d";
        ctx.beginPath();
        ctx.arc(W*.89,H*.135,25,0,Math.PI*2);
        ctx.fill();

        ctx.restore();
    }

    let sun=cycle<1
        ?1
        :cycle<2
            ?1-(cycle-1)
            :0;

    if(sun>.02){
        const sx=W*.18;
        const sy=H*.56;

        ctx.save();
        ctx.globalAlpha=sun;

        const glow=ctx.createRadialGradient(
            sx,sy,5,
            sx,sy,100
        );

        glow.addColorStop(0,"rgba(255,247,160,.65)");
        glow.addColorStop(1,"rgba(255,190,90,0)");

        ctx.fillStyle=glow;
        ctx.fillRect(sx-110,sy-110,220,220);

        ctx.fillStyle="#fff2a2";
        ctx.beginPath();
        ctx.arc(sx,sy,24,0,Math.PI*2);
        ctx.fill();

        ctx.restore();
    }

    drawClouds();
    drawMountains();
    drawTrees();
}

function drawClouds(){
    for(const c of clouds){
        c.x-=c.speed*.016;

        if(c.x<-150){
            c.x=W+100;
        }

        ctx.save();
        ctx.globalAlpha=.55;
        ctx.fillStyle="#fff";

        ctx.beginPath();
        ctx.arc(c.x,c.y,18*c.s,0,Math.PI*2);
        ctx.arc(c.x+22*c.s,c.y-7*c.s,25*c.s,0,Math.PI*2);
        ctx.arc(c.x+48*c.s,c.y,18*c.s,0,Math.PI*2);
        ctx.fill();

        ctx.fillRect(
            c.x-2*c.s,
            c.y,
            50*c.s,
            15*c.s
        );

        ctx.restore();
    }
}

function drawMountains(){
    const base=H*.72;

    ctx.fillStyle="#668ca6";

    ctx.beginPath();
    ctx.moveTo(0,base);

    for(let x=-80;x<W+100;x+=110){
        ctx.lineTo(x+55,base-rand(90,175));
        ctx.lineTo(x+110,base);
    }

    ctx.lineTo(W,H);
    ctx.lineTo(0,H);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle="#4e7286";

    ctx.beginPath();
    ctx.moveTo(0,base+55);

    for(let x=-100;x<W+120;x+=135){
        ctx.lineTo(x+67,base-rand(30,120));
        ctx.lineTo(x+135,base+55);
    }

    ctx.lineTo(W,H);
    ctx.lineTo(0,H);
    ctx.closePath();
    ctx.fill();
}

function drawTrees(){
    const ground=H*.77;

    ctx.fillStyle="#255c50";

    for(let x=-30;x<W+40;x+=42){
        const h=45+((x*17)%40+40);

        ctx.beginPath();
        ctx.moveTo(x,ground+15);
        ctx.lineTo(x+21,ground-h);
        ctx.lineTo(x+42,ground+15);
        ctx.closePath();
        ctx.fill();
    }

    const cycle=(elapsed/18)%3;
    const night=cycle>1
        ?cycle<2
            ?cycle-1
            :1-(cycle-2)
        :0;

    if(night>.15){
        ctx.save();
        ctx.globalAlpha=night;

        for(let i=0;i<10;i++){
            const x=(i*103+25)%W;
            const y=ground+20+(i%3)*25;

            ctx.fillStyle="#15243b";
            ctx.fillRect(x,y,28,20);

            ctx.fillStyle="#ffd96b";
            ctx.fillRect(x+5,y+6,5,5);
            ctx.fillRect(x+17,y+6,5,5);
        }

        ctx.restore();
    }
}

/* =========================================================
   PLATFORM
   ========================================================= */

function createPlatform(x,y,w){
    return{
        x,
        y,
        w:w||rand(95,118),
        h:20,
        spike:false,
        coin:null,
        heart:false
    };
}

function safeX(prev){
    const left=Math.max(8,prev.x-130);
    const right=Math.min(
        W-115,
        prev.x+prev.w-20
    );

    return clamp(
        rand(left,right),
        8,
        Math.max(8,W-115)
    );
}

function generatePlatform(forceSafe=false){
    const prev=platforms[platforms.length-1];

    const p=createPlatform(
        safeX(prev),
        prev.y-rand(82,112),
        rand(96,120)
    );

    const d=difficultyData[save.difficulty];

    if(
        !forceSafe &&
        !prev.spike &&
        chance(d.spikeChance)
    ){
        p.spike=true;
    }

    if(prev.spike){
        p.spike=false;
    }

    if(chance(.58)){
        p.coin={
            x:p.x+p.w/2,
            y:p.y-31,
            spin:Math.random()*Math.PI*2,
            collected:false
        };
    }

    if(chance(.075)){
        p.heart=true;
    }

    platforms.push(p);
}

function setupPlatforms(){
    platforms=[];

    platforms.push(
        createPlatform(
            W/2-55,
            H-105,
            110
        )
    );

    for(let i=0;i<8;i++){
        generatePlatform(true);
    }
}

function ensurePlatforms(){
    while(
        platforms.length &&
        platforms[platforms.length-1].y>-170
    ){
        generatePlatform(false);
    }
}

function endGame(reason){
    if(state!=="playing")return;

    gameOverReason=reason;
    state="gameover";

    stopMusic();

    if(score>save.highScore){
        save.highScore=score;
    }

    if(heightScore>save.bestHeight){
        save.bestHeight=heightScore;
    }

    saveGame();

    gameOverSound();

    for(let i=0;i<22;i++){
        addParticle(
            player.x+player.w/2,
            player.y+player.h/2,
            rand(-160,160),
            rand(-230,80),
            rand(.4,.9),
            rand(2,5),
            "#ffe15a",
            260
        );
    }
}

/* =========================================================
   PLAYER UPDATE
   ========================================================= */

function updatePlayer(dt){
    const speed=260;

    if(leftPressed&&!rightPressed){
        player.vx-=900*dt;
        player.facing=-1;
    }
    else if(rightPressed&&!leftPressed){
        player.vx+=900*dt;
        player.facing=1;
    }
    else{
        player.vx*=Math.pow(.001,dt);
    }

    player.vx=clamp(
        player.vx,
        -speed,
        speed
    );

    player.vy+=1120*dt;

    player.x+=player.vx*dt;
    player.y+=player.vy*dt;

    if(player.x<-player.w){
        player.x=W;
    }

    if(player.x>W){
        player.x=-player.w;
    }

    if(player.invincible>0){
        player.invincible-=dt;
    }

    player.squash*=Math.pow(.001,dt);

    if(player.vy>=0){
        const pb=playerBox();

        let landing=null;

        for(const p of platforms){
            const previousBottom=
                pb.y+pb.h-player.vy*dt;

            if(
                previousBottom<=p.y+7 &&
                pb.y+pb.h>=p.y &&
                pb.x+pb.w>p.x+6 &&
                pb.x<p.x+p.w-6
            ){
                if(!landing||p.y<landing.y){
                    landing=p;
                }
            }
        }

        if(landing){
            player.y=landing.y-player.h;
            player.vy=-480;
            player.squash=1;

            landSound();

            spawnLandingParticles(
                player.x+player.w/2,
                landing.y
            );

            if(landing.spike){
                damagePlayer();
            }

            if(
                landing.coin &&
                !landing.coin.collected
            ){
                collectCoin(landing.coin);
            }

            if(landing.heart){
                landing.heart=false;

                if(player.health<player.maxHealth){
                    player.health++;

                    heartSound();

                    spawnText(
                        player.x,
                        player.y-12,
                        "+1",
                        "#ff6680"
                    );
                }
            }
        }
    }

    const targetY=H*.40;

    if(player.y<targetY){
        const amount=targetY-player.y;

        player.y=targetY;

        for(const p of platforms){
            p.y+=amount;

            if(p.coin&&!p.coin.collected){
                p.coin.y+=amount;
            }
        }

        worldScroll+=amount;

        heightScore=Math.floor(worldScroll/4);

        if(heightScore>score){
            score=heightScore;
        }

        if(heightScore>save.bestHeight){
            save.bestHeight=heightScore;
        }
    }

    if(player.y>H+120){
        endGame("FELL");
    }
}

function damagePlayer(){
    if(player.invincible>0)return;

    player.health--;
    player.invincible=1.15;

    shake=10;
    flash=.25;

    hitSound();

    spawnHitParticles(
        player.x+player.w/2,
        player.y+player.h/2
    );

    if(player.health<=0){
        endGame("NO HEALTH");
    }
}

function collectCoin(c){
    if(c.collected)return;

    c.collected=true;

    runCoins++;
    save.coins++;

    saveGame();

    coinSound();

    spawnCoinParticles(c.x,c.y);

    spawnText(
        c.x,
        c.y-18,
        "+1",
        "#ffe04d"
    );
}

  x:W/2,
  y:H*0.65,
  r:22,
  vx:0,
  vy:0
 };

 platforms=[];
 hearts=[];

 /* starting platforms */

 for(let i=0;i<15;i++){
  createPlatform(H-40-i*95);
 }

 updateHUD();

 requestAnimationFrame(loop);
}


/* CREATE PLATFORM */

function createPlatform(y){

 let width=100+Math.random()*90;

 let x=
  20+Math.random()*(W-width-40);

 let spike=Math.random()<0.25;

 platforms.push({
  x:x,
  y:y,
  w:width,
  h:15,
  spike:spike,
  damaged:false
 });

 /* health pickup */

 if(Math.random()<0.20){

  hearts.push({
   x:x+width/2,
   y:y-28,
   r:11
  });

 }
}


/* HUD */

function updateHUD(){

 let h="";

 for(let i=0;i<health;i++)
  h+="♥ ";

 document.getElementById("health").textContent=h.trim();

 document.getElementById("scoreText").textContent=
  "Score: "+score;
}


/* PAUSE */

function pauseGame(){

 if(!running)return;

 paused=true;

 document.getElementById("pauseScreen").style.display="flex";
}


function resumeGame(){

 paused=false;

 document.getElementById("pauseScreen").style.display="none";
}


function goMenu(){

 running=false;
 paused=false;

 document.getElementById("pauseScreen").style.display="none";
 document.getElementById("gameOver").style.display="none";

 document.getElementById("hud").style.display="none";
 document.getElementById("controls").style.display="none";

 document.getElementById("menu").style.display="flex";

 backMenu();
}


/* GAME OVER */

function gameOver(){

 running=false;

 if(score>highScore){

  highScore=score;

  localStorage.setItem(
   "duckHighScore",
   highScore
  );
 }

 document.getElementById("finalScore").textContent=
  "Score: "+score+"   Best: "+highScore;

 document.getElementById("gameOver").style.display="flex";

 document.getElementById("hud").style.display="none";
 document.getElementById("controls").style.display="none";
}


/* TOUCH */

function touchButton(element,key){

 element.addEventListener("pointerdown",e=>{
  e.preventDefault();
  keys[key]=true;
 });

 ["pointerup","pointercancel","pointerleave"].forEach(type=>{

  element.addEventListener(type,e=>{
   keys[key]=false;
  });

 });

}

touchButton(
 document.getElementById("left"),
 "left"
);

touchButton(
 document.getElementById("right"),
 "right"
);


/* KEYBOARD */

addEventListener("keydown",e=>{

 if(
  e.key==="ArrowLeft"||
  e.key.toLowerCase()==="a"
 )
 keys.left=true;

 if(
  e.key==="ArrowRight"||
  e.key.toLowerCase()==="d"
 )
 keys.right=true;

});


addEventListener("keyup",e=>{

 if(
  e.key==="ArrowLeft"||
  e.key.toLowerCase()==="a"
 )
 keys.left=false;

 if(
  e.key==="ArrowRight"||
  e.key.toLowerCase()==="d"
 )
 keys.right=false;

});


/* GAME LOOP */

function loop(){

 if(!running)return;

 if(!paused){

  /* movement */

  player.vx=
   (keys.right?1:0)-
   (keys.left?1:0);

  player.x+=player.vx*5;

  if(player.x<player.r)
   player.x=player.r;

  if(player.x>W-player.r)
   player.x=W-player.r;


  /* gravity */

  player.vy+=0.35;
  player.y+=player.vy;


  /* platform collision */

  for(const p of platforms){

   if(
    player.vy>0 &&
    player.x>p.x &&
    player.x<p.x+p.w &&
    player.y+player.r>p.y &&
    player.y+player.r<p.y+p.h+15
   ){

    player.y=p.y-player.r;
    player.vy=-9;

    /* spike damage */

    if(
     p.spike &&
     !p.damaged
    ){

     p.damaged=true;

     health--;

     updateHUD();

     if(health<=0){

      gameOver();
      return;
     }

    }

   }

  }


  /* health pickups */

  for(
   let i=hearts.length-1;
   i>=0;
   i--
  ){

   const h=hearts[i];

   const dx=player.x-h.x;
   const dy=player.y-h.y;

   if(
    dx*dx+dy*dy<1200
   ){

    health=Math.min(
     3,
     health+1
    );

    hearts.splice(i,1);

    updateHUD();
   }

  }


  /* upward scrolling */

  if(player.y<H*0.35){

   let move=
    H*0.35-player.y;

   player.y=H*0.35;

   platforms.forEach(p=>{
    p.y+=move;
   });

   hearts.forEach(h=>{
    h.y+=move;
   });

   score++;

   updateHUD();
  }


  /* remove old platforms */

  platforms=
   platforms.filter(
    p=>p.y<H+100
   );

  hearts=
   hearts.filter(
    h=>h.y<H+80
   );


  /* add new platforms */

  let top=Infinity;

  for(const p of platforms)
   top=Math.min(top,p.y);

  while(top>-100){

   let y=top-95;

   createPlatform(y);

   top=y;
  }


  /* fell down */

  if(player.y>H+100){

   health--;

   updateHUD();

   if(health<=0){

    gameOver();
    return;
   }

   player.y=H*0.5;
   player.vy=-6;
  }

 }

 draw();

 requestAnimationFrame(loop);
}


/* DRAW */

function draw(){

 /* sky */

 let sky=
  ctx.createLinearGradient(
   0,0,0,H
  );

 sky.addColorStop(0,"#70d8ff");
 sky.addColorStop(1,"#e8fbff");

 ctx.fillStyle=sky;

 ctx.fillRect(0,0,W,H);


 /* clouds */

 ctx.fillStyle="rgba(255,255,255,.75)";

 for(let i=0;i<6;i++){

  let x=
   (i*180)%W;

  let y=
   70+(i%3)*100;

  ctx.beginPath();

  ctx.arc(x,y,25,0,Math.PI*2);
  ctx.arc(x+28,y-10,32,0,Math.PI*2);
  ctx.arc(x+60,y,25,0,Math.PI*2);

  ctx.fill();
 }


 /* hills */

 ctx.fillStyle="#9bdb9b";

 ctx.beginPath();

 ctx.moveTo(0,H);

 for(
  let x=0;
  x<=W;
  x+=80
 ){

  ctx.lineTo(
   x,
   H-90-
   Math.sin(x*0.01)*35
  );

 }

 ctx.lineTo(W,H);

 ctx.fill();


 /* platforms */

 for(const p of platforms){

  /* dirt */

  ctx.fillStyle="#4b3425";

  ctx.fillRect(
   p.x,
   p.y,
   p.w,
   p.h
  );

  /* grass */

  ctx.fillStyle="#65a84b";

  ctx.fillRect(
   p.x,
   p.y-4,
   p.w,
   5
  );


  /* spikes */

  if(p.spike){

   ctx.fillStyle="#555";

   for(
    let x=p.x+8;
    x<p.x+p.w-5;
    x+=18
   ){

    ctx.beginPath();

    ctx.moveTo(x,p.y);

    ctx.lineTo(x+7,p.y-16);

    ctx.lineTo(x+14,p.y);

    ctx.fill();
   }

  }

 }


 /* hearts */

 for(const h of hearts){

  ctx.font="25px Arial";
  ctx.textAlign="center";
  ctx.fillStyle="#e33";

  ctx.fillText(
   "♥",
   h.x,
   h.y+8
  );

 }


 /* DUCK */

 ctx.save();

 ctx.translate(
  player.x,
  player.y
 );

 ctx.rotate(
  player.vx*0.08
 );

 ctx.font="44px Arial";
 ctx.textAlign="center";
 ctx.textBaseline="middle";

 ctx.fillText(
  "🦆",
  0,
  0
 );

 ctx.restore();

}

</script>

</body>
